apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: gpu-dra
spec:
  limits:
    nodes: 1
  template:
    spec:
      nodeClassRef:
        group: eks.amazonaws.com      # was karpenter.k8s.aws
        kind: NodeClass               # was EC2NodeClass
        name: default                 # built-in Auto Mode NodeClass
      requirements:
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["on-demand", "spot"]
        - key: eks.amazonaws.com/instance-category
          operator: In
          values: ["g"]
        - key: eks.amazonaws.com/instance-gpu-manufacturer
          operator: In
          values: ["nvidia"]
      expireAfter: 336h
      taints:
        - key: nvidia.com/gpu
          effect: NoSchedule
